# Stage-1 A800 training configuration for Wall-X
# This is a more practical starting point than the long default run.

log_name: "robotic_training_a800_stage1"
log_project: "vla_training"
model_type: wall-oss

pretrained_wallx_path: "/root/autodl-fs/models/wall-oss-flow"
processor_path: "/root/autodl-fs/models/wall-oss-flow"
save_path: "/root/autodl-tmp/outputs/wall-x-train-stage1"
use_fast_tokenizer: False
action_tokenizer_path: "/root/autodl-tmp/models/fast"

profile: False
profile_save_path: /root/autodl-tmp/outputs/wall-x-train-stage1/profile
profile_wait_iters: 10
profile_warmup_iters: 5
profile_active_iters: 2

num_warmup_steps: 100
num_training_steps: 20000
learning_rate: 0.00005
min_lr: 0.00005
num_epoch: 3
gradient_accumulation_steps: 1
batch_size_per_gpu: 1
padding_side: left
epoch_save_interval: 1

FSDP2: False
torch_compile: False
num_workers: 4

dof_config:
  follow_left_ee_cartesian_pos: 3
  follow_left_ee_rotation: 3
  follow_left_gripper: 1
  follow_right_ee_cartesian_pos: 3
  follow_right_ee_rotation: 3
  follow_right_gripper: 1
  head_actions: 2
  height: 1
  car_pose: 3

agent_pos_config:
  follow_left_ee_cartesian_pos: 3
  follow_left_ee_rotation: 3
  follow_left_gripper: 1
  follow_right_ee_cartesian_pos: 3
  follow_right_ee_rotation: 3
  follow_right_gripper: 1
  head_actions: 2
  height: 1
  car_pose: 3

norm_stats_path: "/root/autodl-tmp/norm_stats/aloha_mobile_cabinet_stats.json"

enable_customized_robot_config: true
customized_robot_config:
  name: "lerobot/aloha_mobile_cabinet"
  customized_dof_config:
    "action_left_shoulder": 1
    "action_left_elbow": 1
    "action_left_forearm_roll": 1
    "action_left_wrist_angle": 1
    "action_left_wrist_rotate": 1
    "action_left_gripper": 1
    "action_right_waist": 1
    "action_right_shoulder": 1
    "action_right_elbow": 1
    "action_right_forearm_roll": 1
    "action_right_wrist_angle": 1
    "action_right_wrist_rotate": 1
    "action_right_gripper": 1

  customized_agent_pos_config:
    "state_left_shoulder": 1
    "state_left_elbow": 1
    "state_left_forearm_roll": 1
    "state_left_wrist_angle": 1
    "state_left_wrist_rotate": 1
    "state_left_gripper": 1
    "state_right_waist": 1
    "state_right_shoulder": 1
    "state_right_elbow": 1
    "state_right_forearm_roll": 1
    "state_right_wrist_angle": 1
    "state_right_wrist_rotate": 1
    "state_right_gripper": 1

data:
  use_lerobot: true
  lerobot_config:
    repo_id: "lerobot/aloha_mobile_cabinet"
    root: "/root/autodl-tmp/datasets"
    episodes: null
    image_transforms: null
    delta_timestamps: null
    tolerance_s: 1e-4
    revision: null
    force_cache_sync: false
    download_videos: true
    video_backend: null

  action_horizon: 32
  train_test_split: 0.95

  obs_action_keys:
    - follow_left_ee_cartesian_pos
    - follow_left_ee_rotation
    - follow_left_gripper
    - follow_right_ee_cartesian_pos
    - follow_right_ee_rotation
    - follow_right_gripper
    - head_actions
    - height
    - car_pose

  predict_action_keys:
    - follow_left_ee_cartesian_pos
    - follow_left_ee_rotation
    - follow_left_gripper
    - follow_right_ee_cartesian_pos
    - follow_right_ee_rotation
    - follow_right_gripper
    - head_actions
    - height
    - car_pose

  resolution:
    face_view: 256
    left_wrist_view: 256
    right_wrist_view: 256
    move1_view: 256
    move2_view: 256
    top_view: 256
    wall_view: 256
    multi_modal: 256
